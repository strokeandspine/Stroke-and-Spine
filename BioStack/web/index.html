<style>
/* Layout: sticky top bar with view tabs; single column of instrument-panel sections, two columns on wide screens. */
:root {
  --bg: #f3f6f5; --surface: #ffffff; --ink: #13201c; --muted: #5b6b66; --line: #d9e2df;
  --accent: #0b6e63; --accent-soft: #dcefeb; --warn: #a15c00; --warn-soft: #fbefdc; --bad: #b42318;
  --ev-a: #0b6e63; --ev-b: #3d7f2a; --ev-c: #8a6d00; --ev-d: #8a8f8d;
  --display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body: "IBM Plex Sans", -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0d1513; --surface: #15201d; --ink: #e6efec; --muted: #93a6a0; --line: #273632;
  --accent: #4fc7b5; --accent-soft: #173a34; --warn: #e5a54a; --warn-soft: #3a2a12; --bad: #f07a6e;
  --ev-a: #4fc7b5; --ev-b: #8fcf73; --ev-c: #e1c04f; --ev-d: #8d9894; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0d1513; --surface: #15201d; --ink: #e6efec; --muted: #93a6a0; --line: #273632;
  --accent: #4fc7b5; --accent-soft: #173a34; --warn: #e5a54a; --warn-soft: #3a2a12; --bad: #f07a6e;
  --ev-a: #4fc7b5; --ev-b: #8fcf73; --ev-c: #e1c04f; --ev-d: #8d9894; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.55 var(--body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.wrap { max-width: 1080px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.bar { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding-block: 10px; }
.brand { font: 800 1.35rem/1 var(--display); letter-spacing: -.02em; display: flex; gap: 8px; align-items: center; }
.brand i { width: 12px; height: 22px; border-radius: 6px; background: linear-gradient(var(--accent) 50%, var(--ev-c) 50%); display: inline-block; }
nav { display: flex; gap: 4px; overflow-x: auto; flex: 1; min-width: 0; }
nav a { padding: 6px 12px; border-radius: 999px; color: var(--muted); text-decoration: none; font-weight: 500; white-space: nowrap; }
nav a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
main { padding-block: 24px 64px; display: grid; gap: 24px; }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; letter-spacing: -.01em; }
h1 { font-size: 1.9rem; font-weight: 800; } h2 { font-size: 1.2rem; font-weight: 600; } h3 { font-size: 1rem; font-weight: 600; }
p { margin: 0; }
.muted { color: var(--muted); }
.eyebrow { font: 500 .72rem/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; display: grid; gap: 14px; min-width: 0; }
.grid2 { display: grid; gap: 24px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); }
.notice { background: var(--warn-soft); color: var(--ink); border-radius: 10px; padding: 12px 14px; font-size: .9rem; border-left: 4px solid var(--warn); }
button, .btn { font: 500 .9rem var(--body); border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 7px 12px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input, select, textarea { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; min-width: 0; }
label { display: grid; gap: 4px; font-size: .85rem; color: var(--muted); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; }
.row > * { flex: 1 1 140px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { font-size: .8rem; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--surface); border-color: var(--accent); }
.ev { font: 600 .72rem/1 var(--mono); padding: 4px 6px; border-radius: 4px; color: var(--surface); flex: none; }
.ev-A { background: var(--ev-a); } .ev-B { background: var(--ev-b); } .ev-C { background: var(--ev-c); } .ev-D { background: var(--ev-d); }
.ev-Rx { background: var(--ink); }
.list { display: grid; gap: 0; }
.item { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 10px 4px; border-top: 1px solid var(--line); cursor: pointer; background: none; border-left: 0; border-right: 0; border-bottom: 0; border-radius: 0; text-align: left; width: 100%; }
.item:hover { background: var(--accent-soft); }
.item .sub { font-size: .82rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item > div { min-width: 0; }
.dose { font: .82rem var(--mono); color: var(--muted); text-align: right; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.check { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.check input[type=checkbox] { width: 22px; height: 22px; accent-color: var(--accent); }
.dots { display: flex; gap: 3px; }
.dots span { width: 9px; height: 9px; border-radius: 2px; background: var(--line); }
.dots span.on { background: var(--accent); }
.goals { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 220px), 1fr)); }
.goal { text-align: left; display: grid; gap: 6px; padding: 14px; border-radius: 12px; }
.goal b { font: 600 1rem var(--display); }
.goal .n { font: .8rem var(--mono); color: var(--muted); }
.bars { display: flex; height: 6px; border-radius: 3px; overflow: hidden; background: var(--line); }
.bars span { display: block; }
table { border-collapse: collapse; width: 100%; font-size: .9rem; }
.tablewrap { overflow-x: auto; }
th, td { text-align: left; padding: 8px 6px; border-top: 1px solid var(--line); vertical-align: top; }
th { font: 500 .72rem var(--mono); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
td.num { font-variant-numeric: tabular-nums; font-family: var(--mono); }
.apps { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); }
.app { display: grid; gap: 4px; padding: 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--ink); text-decoration: none; }
.app:hover { border-color: var(--accent); }
.app .cat { font: .72rem var(--mono); text-transform: uppercase; letter-spacing: .06em; color: var(--accent); }
dialog { border: 1px solid var(--line); border-radius: 14px; padding: 0; width: min(640px, calc(100vw - 32px)); background: var(--surface); color: var(--ink); }
dialog::backdrop { background: rgb(0 0 0 / .45); }
.dlg { padding: 20px; display: grid; gap: 14px; max-height: 85vh; overflow-y: auto; }
.facts { display: grid; grid-template-columns: 120px 1fr; gap: 8px 14px; font-size: .92rem; }
.facts dt { color: var(--muted); font: .78rem var(--mono); text-transform: uppercase; letter-spacing: .05em; padding-top: 3px; }
.facts dd { margin: 0; }
@media (max-width: 480px) { .facts { grid-template-columns: 1fr; } .facts dd { margin-bottom: 6px; } .dose { display: none; } }
.spark { width: 120px; height: 32px; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-size: .9rem; z-index: 20; }
.empty { padding: 18px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 10px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: .8rem; color: var(--muted); }
.legend span { display: inline-flex; gap: 6px; align-items: center; }
@media (prefers-reduced-motion: no-preference) { .item, .chip, nav a { transition: background .15s; } }
</style>

<script>
const CATALOG = {"version":1,"goals":[{"id":"longevity","name":"Longevity & healthy ageing","symbol":"hourglass"},{"id":"strength","name":"Strength & power","symbol":"dumbbell"},{"id":"hypertrophy","name":"Muscle growth","symbol":"figure.strengthtraining.traditional"},{"id":"endurance","name":"Endurance","symbol":"figure.run"},{"id":"recovery","name":"Recovery","symbol":"bandage"},{"id":"bodycomp","name":"Fat loss & body composition","symbol":"scalemass"},{"id":"sleep","name":"Sleep","symbol":"moon.zzz"},{"id":"cognition","name":"Focus & cognition","symbol":"brain.head.profile"},{"id":"stress","name":"Stress & mood","symbol":"leaf"},{"id":"heart","name":"Heart & blood vessels","symbol":"heart"},{"id":"metabolic","name":"Blood sugar & metabolism","symbol":"drop"},{"id":"joints","name":"Joints, tendons & bone","symbol":"figure.walk"},{"id":"immunity","name":"Immunity","symbol":"shield"},{"id":"hormones","name":"Hormonal health","symbol":"waveform.path.ecg"},{"id":"gut","name":"Gut health","symbol":"circle.grid.cross"},{"id":"skin","name":"Skin, hair & eyes","symbol":"sparkles"}],"supplements":[{"id":"creatine-monohydrate","name":"Creatine monohydrate","kind":"supplement","category":"Performance","dose":"3–5 g daily","timing":"Any time; consistency matters more than timing","evidence":"A","goals":["strength","hypertrophy","cognition","longevity"],"notes":"Optional loading of 20 g/day for 5–7 days saturates muscle faster. Can raise serum creatinine without harming the kidneys, so tell whoever reads your labs."},{"id":"whey-protein","name":"Whey protein","kind":"supplement","category":"Protein","dose":"20–40 g per serving, toward 1.6–2.2 g protein/kg/day in total","timing":"After training or with meals","evidence":"A","goals":["hypertrophy","strength","recovery","bodycomp"],"notes":"Count it toward total daily protein rather than adding on top. Isolate suits lactose sensitivity."},{"id":"casein-protein","name":"Casein protein","kind":"supplement","category":"Protein","dose":"30–40 g","timing":"Before bed","evidence":"B","goals":["hypertrophy","recovery"],"notes":"Slow digestion supports overnight muscle protein synthesis."},{"id":"plant-protein-blend","name":"Plant protein blend","kind":"supplement","category":"Protein","dose":"25–40 g per serving","timing":"With meals","evidence":"B","goals":["hypertrophy","bodycomp"],"notes":"Pea + rice blends match whey best; slightly higher servings make up for lower leucine."},{"id":"essential-amino-acids-eaas","name":"Essential amino acids (EAAs)","kind":"supplement","category":"Protein","dose":"10–15 g","timing":"Around training","evidence":"C","goals":["hypertrophy","recovery"],"notes":"Useful when whole-protein intake is low; redundant if daily protein is adequate."},{"id":"branched-chain-amino-acids-bcaas","name":"Branched-chain amino acids (BCAAs)","kind":"supplement","category":"Protein","dose":"5–10 g","timing":"Around training","evidence":"D","goals":["recovery"],"notes":"Little benefit when total protein intake is adequate; EAAs or whole protein are better."},{"id":"leucine","name":"Leucine","kind":"supplement","category":"Protein","dose":"2–3 g per meal","timing":"With lower-protein meals","evidence":"C","goals":["hypertrophy"],"notes":"Most useful for older adults with low appetite."},{"id":"hmb","name":"HMB","kind":"supplement","category":"Performance","dose":"3 g daily, split","timing":"With meals","evidence":"C","goals":["hypertrophy","recovery"],"notes":"Benefits mainly in untrained or older people and during calorie restriction."},{"id":"caffeine","name":"Caffeine","kind":"supplement","category":"Stimulant","dose":"3–6 mg/kg","timing":"30–60 minutes before exercise","evidence":"A","goals":["endurance","strength","cognition","bodycomp"],"notes":"Keep to about 400 mg/day for healthy adults and stop 8+ hours before bed. Avoid with arrhythmias, uncontrolled blood pressure or pregnancy beyond 200 mg."},{"id":"l-theanine","name":"L-theanine","kind":"supplement","category":"Nootropic","dose":"100–200 mg","timing":"With caffeine, or in the evening","evidence":"B","goals":["cognition","stress","sleep"],"notes":"Smooths caffeine jitters; 2:1 theanine to caffeine is common."},{"id":"beta-alanine","name":"Beta-alanine","kind":"supplement","category":"Performance","dose":"3.2–6.4 g daily in 0.8–1.6 g doses","timing":"With meals, daily for 4+ weeks","evidence":"A","goals":["endurance","strength"],"notes":"Helps efforts of 1–4 minutes. Tingling (paresthesia) is harmless; sustained-release forms reduce it."},{"id":"citrulline-malate","name":"Citrulline malate","kind":"supplement","category":"Performance","dose":"6–8 g","timing":"60 minutes before training","evidence":"B","goals":["endurance","strength","heart"],"notes":"Raises arginine and nitric oxide more reliably than arginine itself."},{"id":"sodium-bicarbonate","name":"Sodium bicarbonate","kind":"supplement","category":"Performance","dose":"0.2–0.3 g/kg","timing":"60–180 minutes before high-intensity events","evidence":"A","goals":["endurance"],"notes":"Gut upset is common; split doses or enteric capsules help. High sodium load."},{"id":"dietary-nitrate-beetroot-juice","name":"Dietary nitrate (beetroot juice)","kind":"supplement","category":"Performance","dose":"6–8 mmol nitrate (~400–500 mg)","timing":"2–3 hours before exercise","evidence":"A","goals":["endurance","heart"],"notes":"Antibacterial mouthwash blocks the effect. Harmless red urine (beeturia)."},{"id":"betaine-tmg","name":"Betaine (TMG)","kind":"supplement","category":"Performance","dose":"2.5 g daily","timing":"With food","evidence":"C","goals":["strength","metabolic"],"notes":"May slightly raise LDL in some people."},{"id":"taurine","name":"Taurine","kind":"supplement","category":"Amino acid","dose":"1–3 g daily","timing":"Any time","evidence":"C","goals":["endurance","heart","longevity"],"notes":"Ageing research in animals is promising; human data are early."},{"id":"carbohydrate-drinks-gels","name":"Carbohydrate (drinks, gels)","kind":"supplement","category":"Sports nutrition","dose":"30–60 g/hour; up to 90 g/hour glucose+fructose for long events","timing":"During sessions over 60–90 minutes","evidence":"A","goals":["endurance"],"notes":"Train the gut beforehand to avoid GI distress."},{"id":"electrolytes-sodium","name":"Electrolytes (sodium)","kind":"supplement","category":"Sports nutrition","dose":"300–600 mg sodium per hour of sweating","timing":"During long or hot sessions","evidence":"B","goals":["endurance"],"notes":"Needs vary widely; a sweat test can personalise. Caution with high blood pressure or kidney disease."},{"id":"ketone-esters","name":"Ketone esters","kind":"supplement","category":"Sports nutrition","dose":"10–25 g","timing":"30–60 minutes before","evidence":"D","goals":["endurance","cognition"],"notes":"Mixed performance results; GI upset and cost are common issues."},{"id":"mct-oil","name":"MCT oil","kind":"supplement","category":"Fat","dose":"5–15 g, building up slowly","timing":"With food","evidence":"D","goals":["cognition","bodycomp"],"notes":"Start low to avoid GI upset."},{"id":"l-carnitine-l-tartrate","name":"L-carnitine L-tartrate","kind":"supplement","category":"Performance","dose":"1–2 g daily","timing":"With carbohydrate-containing meals","evidence":"C","goals":["recovery"],"notes":"May reduce muscle damage markers. Raises TMAO, of uncertain significance."},{"id":"acetyl-l-carnitine","name":"Acetyl-L-carnitine","kind":"supplement","category":"Nootropic","dose":"500–2,000 mg","timing":"Morning","evidence":"C","goals":["cognition","stress"],"notes":"Some evidence for mood and fatigue in older adults."},{"id":"tart-cherry","name":"Tart cherry","kind":"supplement","category":"Recovery","dose":"480 mg extract or 30 ml concentrate twice daily","timing":"Around hard training blocks","evidence":"C","goals":["recovery","sleep"],"notes":"Avoid constant use if you want maximal training adaptation from inflammation."},{"id":"collagen-peptides","name":"Collagen peptides","kind":"supplement","category":"Recovery","dose":"10–15 g with ~50 mg vitamin C","timing":"30–60 minutes before tendon/joint loading","evidence":"C","goals":["joints","skin","recovery"],"notes":"Not a complete protein; don't count toward muscle-building protein."},{"id":"glutamine","name":"Glutamine","kind":"supplement","category":"Amino acid","dose":"5–10 g","timing":"Any time","evidence":"D","goals":["gut","recovery"],"notes":"Little performance effect in healthy athletes."},{"id":"vitamin-d3","name":"Vitamin D3","kind":"supplement","category":"Vitamin","dose":"1,000–4,000 IU daily, guided by 25(OH)D blood level","timing":"With a meal containing fat","evidence":"A","goals":["immunity","joints","longevity","hormones"],"notes":"Stay at or under 4,000 IU/day unless a clinician prescribes more. Retest after 8–12 weeks."},{"id":"vitamin-k2-mk-7","name":"Vitamin K2 (MK-7)","kind":"supplement","category":"Vitamin","dose":"90–200 mcg","timing":"With fat-containing food","evidence":"C","goals":["joints","heart"],"notes":"Do not take with warfarin unless your clinician agrees."},{"id":"vitamin-c","name":"Vitamin C","kind":"supplement","category":"Vitamin","dose":"200–1,000 mg","timing":"Split through the day","evidence":"B","goals":["immunity","skin"],"notes":"Mega-doses around training may blunt adaptations; kidney stone risk above 1 g/day."},{"id":"vitamin-b12","name":"Vitamin B12","kind":"supplement","category":"Vitamin","dose":"250–1,000 mcg","timing":"Daily","evidence":"A","goals":["cognition","longevity"],"notes":"Important for vegans, people over 50 and metformin users. Treats deficiency only."},{"id":"folate-methylfolate","name":"Folate (methylfolate)","kind":"supplement","category":"Vitamin","dose":"400 mcg DFE","timing":"Daily","evidence":"A","goals":["heart","cognition"],"notes":"Essential before and during pregnancy. High doses can mask B12 deficiency."},{"id":"b-complex","name":"B-complex","kind":"supplement","category":"Vitamin","dose":"About 100% of daily values","timing":"Morning with food","evidence":"C","goals":["cognition","stress"],"notes":"Bright yellow urine from riboflavin is normal. Biotin interferes with many lab tests: stop 2–3 days before blood work."},{"id":"vitamin-e","name":"Vitamin E","kind":"supplement","category":"Vitamin","dose":"15 mg (22 IU) daily from food and supplements","timing":"With food","evidence":"D","goals":["skin"],"notes":"Avoid high-dose supplements: linked to higher prostate cancer risk and bleeding."},{"id":"multivitamin","name":"Multivitamin","kind":"supplement","category":"Vitamin","dose":"1 serving daily","timing":"With breakfast","evidence":"B","goals":["longevity","cognition","immunity"],"notes":"Large trials (COSMOS) found modest cognitive benefits in older adults."},{"id":"iron","name":"Iron","kind":"supplement","category":"Mineral","dose":"18–65 mg elemental, only when ferritin or iron is low","timing":"Alternate days, with vitamin C, away from coffee, tea and calcium","evidence":"A","goals":["endurance"],"notes":"Test before you take it. Excess iron is harmful, especially with hemochromatosis."},{"id":"magnesium-glycinate","name":"Magnesium glycinate","kind":"supplement","category":"Mineral","dose":"200–400 mg elemental","timing":"Evening","evidence":"B","goals":["sleep","stress","recovery"],"notes":"Supplemental upper limit is 350 mg/day for most adults; above that diarrhoea is common. Caution with kidney disease."},{"id":"magnesium-l-threonate","name":"Magnesium L-threonate","kind":"supplement","category":"Mineral","dose":"1.5–2 g compound (~144 mg magnesium)","timing":"Evening","evidence":"C","goals":["cognition","sleep"],"notes":"Marketed for brain uptake; human trials are small."},{"id":"zinc","name":"Zinc","kind":"supplement","category":"Mineral","dose":"8–11 mg; 15–30 mg if low","timing":"With food","evidence":"B","goals":["immunity","hormones","skin"],"notes":"Long-term intake above 40 mg/day causes copper deficiency."},{"id":"calcium","name":"Calcium","kind":"supplement","category":"Mineral","dose":"Enough to reach 1,000–1,200 mg/day including diet","timing":"No more than 500 mg at a time","evidence":"B","goals":["joints"],"notes":"Food sources preferred. Separate from iron and thyroid medication."},{"id":"potassium-citrate","name":"Potassium citrate","kind":"supplement","category":"Mineral","dose":"Food first; supplements are limited to 99 mg per pill in the US","timing":"With meals","evidence":"B","goals":["heart"],"notes":"Dangerous with kidney disease, ACE inhibitors, ARBs or potassium-sparing diuretics."},{"id":"iodine","name":"Iodine","kind":"supplement","category":"Mineral","dose":"150 mcg","timing":"Daily","evidence":"B","goals":["hormones"],"notes":"Excess can trigger thyroid problems; avoid kelp mega-doses."},{"id":"selenium","name":"Selenium","kind":"supplement","category":"Mineral","dose":"55–100 mcg","timing":"Daily","evidence":"B","goals":["immunity","hormones"],"notes":"Upper limit 400 mcg/day. Two Brazil nuts ≈ 100–200 mcg."},{"id":"boron","name":"Boron","kind":"supplement","category":"Mineral","dose":"3–10 mg","timing":"With food","evidence":"C","goals":["joints","hormones"],"notes":"Small studies only."},{"id":"chromium-picolinate","name":"Chromium picolinate","kind":"supplement","category":"Mineral","dose":"200–1,000 mcg","timing":"With meals","evidence":"D","goals":["metabolic"],"notes":"Small effects on glucose at best."},{"id":"omega-3-epa-dha","name":"Omega-3 (EPA + DHA)","kind":"supplement","category":"Fatty acid","dose":"1–3 g combined EPA+DHA","timing":"With meals","evidence":"A","goals":["heart","longevity","joints","cognition","stress"],"notes":"Above 3 g/day may raise atrial fibrillation and bleeding risk. Check with your clinician if you take blood thinners."},{"id":"plant-sterols","name":"Plant sterols","kind":"supplement","category":"Heart","dose":"1.5–3 g daily","timing":"With meals","evidence":"A","goals":["heart"],"notes":"Lowers LDL by 6–12%."},{"id":"psyllium-husk","name":"Psyllium husk","kind":"supplement","category":"Fibre","dose":"5–10 g with a full glass of water","timing":"Before meals","evidence":"A","goals":["heart","metabolic","gut","bodycomp"],"notes":"Lowers LDL and blunts glucose spikes. Separate from medications by 2 hours."},{"id":"red-yeast-rice","name":"Red yeast rice","kind":"supplement","category":"Heart","dose":"1.2–2.4 g, standardised products only","timing":"Evening","evidence":"C","goals":["heart"],"notes":"Contains monacolin K, identical to lovastatin, with the same risks. Product quality varies; a 2024 Japanese outbreak of kidney injury was linked to contaminated products. Don't combine with statins."},{"id":"aged-garlic-extract","name":"Aged garlic extract","kind":"supplement","category":"Heart","dose":"600–1,200 mg","timing":"With food","evidence":"B","goals":["heart","immunity"],"notes":"Modest blood pressure reduction. May increase bleeding with anticoagulants."},{"id":"cocoa-flavanols","name":"Cocoa flavanols","kind":"supplement","category":"Heart","dose":"500–900 mg flavanols","timing":"Daily","evidence":"B","goals":["heart","cognition"],"notes":"The COSMOS trial suggested lower cardiovascular death. Chocolate is not an efficient source."},{"id":"coenzyme-q10-ubiquinol","name":"Coenzyme Q10 (ubiquinol)","kind":"supplement","category":"Antioxidant","dose":"100–300 mg","timing":"With a meal containing fat","evidence":"C","goals":["heart","longevity","endurance"],"notes":"Often used with statins for muscle aches (mixed evidence). May reduce warfarin's effect."},{"id":"berberine","name":"Berberine","kind":"supplement","category":"Metabolic","dose":"500 mg 2–3 times daily","timing":"With meals","evidence":"B","goals":["metabolic","heart","bodycomp"],"notes":"Lowers glucose and LDL. Interacts with many drugs via CYP enzymes; avoid in pregnancy. GI upset common."},{"id":"alpha-lipoic-acid","name":"Alpha-lipoic acid","kind":"supplement","category":"Metabolic","dose":"300–600 mg","timing":"On an empty stomach","evidence":"C","goals":["metabolic"],"notes":"Can lower blood sugar; monitor if diabetic."},{"id":"myo-inositol","name":"Myo-inositol","kind":"supplement","category":"Metabolic","dose":"2–4 g","timing":"Split doses","evidence":"B","goals":["metabolic","hormones","stress"],"notes":"Best evidence is in PCOS."},{"id":"ceylon-cinnamon","name":"Ceylon cinnamon","kind":"supplement","category":"Metabolic","dose":"1–3 g","timing":"With meals","evidence":"D","goals":["metabolic"],"notes":"Choose Ceylon: cassia contains coumarin, which can harm the liver."},{"id":"green-tea-extract-egcg","name":"Green tea extract (EGCG)","kind":"supplement","category":"Metabolic","dose":"250–500 mg EGCG","timing":"With food, never fasted","evidence":"C","goals":["bodycomp","metabolic"],"notes":"Liver injury reported, mostly with fasting doses above 800 mg/day."},{"id":"curcumin-enhanced-absorption","name":"Curcumin (enhanced absorption)","kind":"supplement","category":"Anti-inflammatory","dose":"500–1,000 mg","timing":"With food","evidence":"C","goals":["joints","recovery","longevity"],"notes":"Rare liver injury, especially with piperine forms. Caution with anticoagulants and gallstones."},{"id":"ginger","name":"Ginger","kind":"supplement","category":"Anti-inflammatory","dose":"1–2 g","timing":"With food","evidence":"C","goals":["recovery","gut"],"notes":"Helps nausea and mild muscle soreness."},{"id":"boswellia-serrata","name":"Boswellia serrata","kind":"supplement","category":"Anti-inflammatory","dose":"100–250 mg AKBA-standardised extract","timing":"With food","evidence":"C","goals":["joints"],"notes":"Small trials in knee osteoarthritis are positive."},{"id":"glucosamine-sulfate","name":"Glucosamine sulfate","kind":"supplement","category":"Joint","dose":"1,500 mg","timing":"Daily","evidence":"C","goals":["joints"],"notes":"Mixed results for knee osteoarthritis. Shellfish-derived versions exist."},{"id":"chondroitin","name":"Chondroitin","kind":"supplement","category":"Joint","dose":"800–1,200 mg","timing":"Daily","evidence":"C","goals":["joints"],"notes":"Often paired with glucosamine. May raise bleeding with warfarin."},{"id":"msm","name":"MSM","kind":"supplement","category":"Joint","dose":"1.5–3 g","timing":"Daily","evidence":"C","goals":["joints","recovery"],"notes":"Small trials only."},{"id":"oral-hyaluronic-acid","name":"Oral hyaluronic acid","kind":"supplement","category":"Joint","dose":"120–200 mg","timing":"Daily","evidence":"C","goals":["joints","skin"],"notes":"Small trials only."},{"id":"astaxanthin","name":"Astaxanthin","kind":"supplement","category":"Antioxidant","dose":"4–12 mg","timing":"With fat-containing food","evidence":"C","goals":["skin","recovery"],"notes":"May reduce exercise-induced oxidative stress."},{"id":"lutein-zeaxanthin","name":"Lutein + zeaxanthin","kind":"supplement","category":"Antioxidant","dose":"10 mg lutein + 2 mg zeaxanthin","timing":"With food","evidence":"B","goals":["skin","cognition"],"notes":"AREDS2 formula for macular degeneration."},{"id":"n-acetylcysteine-nac","name":"N-acetylcysteine (NAC)","kind":"supplement","category":"Antioxidant","dose":"600–1,200 mg","timing":"Daily","evidence":"C","goals":["longevity","immunity"],"notes":"Glutathione precursor. High doses around training may blunt adaptations."},{"id":"liposomal-glutathione","name":"Liposomal glutathione","kind":"supplement","category":"Antioxidant","dose":"250–1,000 mg","timing":"Daily","evidence":"D","goals":["longevity"],"notes":"Oral absorption is debated."},{"id":"nicotinamide-riboside-nr","name":"Nicotinamide riboside (NR)","kind":"supplement","category":"Longevity","dose":"300–1,000 mg","timing":"Morning","evidence":"C","goals":["longevity"],"notes":"Raises NAD+ in blood reliably; clinical benefits are not yet shown."},{"id":"nmn","name":"NMN","kind":"supplement","category":"Longevity","dose":"250–1,000 mg","timing":"Morning","evidence":"C","goals":["longevity"],"notes":"Raises NAD+; human outcome data are limited. US regulatory status has changed over time."},{"id":"resveratrol","name":"Resveratrol","kind":"supplement","category":"Longevity","dose":"150–500 mg","timing":"With fat-containing food","evidence":"D","goals":["longevity","heart"],"notes":"Human results are inconsistent."},{"id":"quercetin","name":"Quercetin","kind":"supplement","category":"Longevity","dose":"500–1,000 mg","timing":"With food","evidence":"C","goals":["longevity","immunity"],"notes":"Studied as a senolytic alongside other drugs. CYP interactions."},{"id":"fisetin","name":"Fisetin","kind":"supplement","category":"Longevity","dose":"100–500 mg","timing":"With fat-containing food","evidence":"D","goals":["longevity"],"notes":"Senolytic trials in humans are ongoing; results not yet established."},{"id":"spermidine","name":"Spermidine","kind":"supplement","category":"Longevity","dose":"1–6 mg","timing":"Daily","evidence":"C","goals":["longevity","skin"],"notes":"Autophagy-related research; human trials are small."},{"id":"urolithin-a","name":"Urolithin A","kind":"supplement","category":"Longevity","dose":"500–1,000 mg","timing":"Daily","evidence":"C","goals":["longevity","endurance"],"notes":"Small trials show better muscle endurance and mitochondrial markers."},{"id":"calcium-alpha-ketoglutarate-ca-akg","name":"Calcium alpha-ketoglutarate (Ca-AKG)","kind":"supplement","category":"Longevity","dose":"1 g","timing":"Daily","evidence":"D","goals":["longevity"],"notes":"Mostly animal data; human trials ongoing."},{"id":"sulforaphane-broccoli-sprout","name":"Sulforaphane (broccoli sprout)","kind":"supplement","category":"Longevity","dose":"10–40 mg sulforaphane, or glucoraphanin with myrosinase","timing":"With food","evidence":"C","goals":["longevity"],"notes":"Activates Nrf2 antioxidant pathways."},{"id":"pycnogenol-pine-bark","name":"Pycnogenol (pine bark)","kind":"supplement","category":"Antioxidant","dose":"100–200 mg","timing":"Daily","evidence":"C","goals":["heart","skin"],"notes":"Modest blood pressure and circulation effects."},{"id":"ashwagandha-root-extract","name":"Ashwagandha (root extract)","kind":"supplement","category":"Adaptogen","dose":"300–600 mg standardised extract","timing":"Daily or evening","evidence":"B","goals":["stress","sleep","strength"],"notes":"Rare liver injury reported. Avoid in pregnancy; caution with thyroid disease."},{"id":"rhodiola-rosea","name":"Rhodiola rosea","kind":"supplement","category":"Adaptogen","dose":"200–600 mg (3% rosavins)","timing":"Morning","evidence":"C","goals":["stress","endurance","cognition"],"notes":"Can feel stimulating; avoid late in the day."},{"id":"panax-ginseng","name":"Panax ginseng","kind":"supplement","category":"Adaptogen","dose":"200–400 mg extract","timing":"Morning","evidence":"C","goals":["cognition","immunity","stress"],"notes":"May interact with warfarin and diabetes medication."},{"id":"tongkat-ali","name":"Tongkat ali","kind":"supplement","category":"Adaptogen","dose":"200–400 mg standardised extract","timing":"Morning","evidence":"C","goals":["hormones","stress"],"notes":"Small trials; quality and contamination vary."},{"id":"fenugreek-extract","name":"Fenugreek extract","kind":"supplement","category":"Herbal","dose":"500–600 mg","timing":"With food","evidence":"C","goals":["hormones","metabolic"],"notes":"Can lower blood sugar. Maple-syrup body odour is harmless."},{"id":"maca","name":"Maca","kind":"supplement","category":"Herbal","dose":"1.5–3 g","timing":"Daily","evidence":"D","goals":["hormones","stress"],"notes":"Evidence mainly for libido."},{"id":"shilajit","name":"Shilajit","kind":"supplement","category":"Herbal","dose":"250–500 mg purified","timing":"Daily","evidence":"D","goals":["hormones","endurance"],"notes":"Unpurified products can contain heavy metals; buy third-party tested."},{"id":"saffron","name":"Saffron","kind":"supplement","category":"Herbal","dose":"30 mg","timing":"Daily","evidence":"B","goals":["stress","sleep"],"notes":"Several trials show mood benefits."},{"id":"lion-s-mane","name":"Lion's mane","kind":"supplement","category":"Mushroom","dose":"500–3,000 mg","timing":"Daily","evidence":"C","goals":["cognition"],"notes":"Small human trials."},{"id":"cordyceps","name":"Cordyceps","kind":"supplement","category":"Mushroom","dose":"1–3 g","timing":"Daily","evidence":"D","goals":["endurance"],"notes":"Mixed results for VO2 max."},{"id":"reishi","name":"Reishi","kind":"supplement","category":"Mushroom","dose":"1–3 g","timing":"Evening","evidence":"D","goals":["sleep","immunity"],"notes":"Rare liver toxicity; caution with anticoagulants."},{"id":"bacopa-monnieri","name":"Bacopa monnieri","kind":"supplement","category":"Nootropic","dose":"300 mg (50% bacosides)","timing":"With fat-containing food, for 8–12 weeks","evidence":"B","goals":["cognition","stress"],"notes":"Effects build slowly; GI upset possible."},{"id":"alpha-gpc","name":"Alpha-GPC","kind":"supplement","category":"Nootropic","dose":"300–600 mg","timing":"Morning or before training","evidence":"C","goals":["cognition","strength"],"notes":"Choline source; may slightly raise TMAO."},{"id":"citicoline-cdp-choline","name":"Citicoline (CDP-choline)","kind":"supplement","category":"Nootropic","dose":"250–500 mg","timing":"Morning","evidence":"C","goals":["cognition"],"notes":"Attention benefits in small trials."},{"id":"l-tyrosine","name":"L-tyrosine","kind":"supplement","category":"Nootropic","dose":"500–2,000 mg","timing":"60 minutes before demanding tasks","evidence":"C","goals":["cognition","stress"],"notes":"Avoid with MAO inhibitors or hyperthyroidism."},{"id":"5-htp","name":"5-HTP","kind":"supplement","category":"Mood","dose":"50–200 mg","timing":"Evening","evidence":"D","goals":["stress","sleep"],"notes":"Risk of serotonin syndrome with SSRIs, SNRIs, triptans or MAOIs: do not combine."},{"id":"melatonin","name":"Melatonin","kind":"supplement","category":"Sleep","dose":"0.3–3 mg","timing":"30–60 minutes before bed","evidence":"B","goals":["sleep"],"notes":"Low doses work as well as high ones. Useful for jet lag and shift work."},{"id":"glycine","name":"Glycine","kind":"supplement","category":"Sleep","dose":"3 g","timing":"Before bed","evidence":"C","goals":["sleep"],"notes":"Small trials show improved sleep quality."},{"id":"apigenin","name":"Apigenin","kind":"supplement","category":"Sleep","dose":"50 mg","timing":"Before bed","evidence":"D","goals":["sleep"],"notes":"Chamomile compound; limited human data."},{"id":"gaba","name":"GABA","kind":"supplement","category":"Sleep","dose":"100–300 mg","timing":"Before bed","evidence":"D","goals":["sleep","stress"],"notes":"Unclear whether it crosses into the brain."},{"id":"probiotics-strain-specific","name":"Probiotics (strain-specific)","kind":"supplement","category":"Gut","dose":"Per strain, typically 1–10 billion CFU","timing":"Daily","evidence":"C","goals":["gut","immunity"],"notes":"Benefits depend on the exact strain and condition."},{"id":"bovine-colostrum","name":"Bovine colostrum","kind":"supplement","category":"Gut","dose":"10–20 g","timing":"Daily","evidence":"C","goals":["gut","immunity"],"notes":"May reduce gut permeability during heavy training."},{"id":"digestive-enzymes","name":"Digestive enzymes","kind":"supplement","category":"Gut","dose":"As labelled","timing":"With meals","evidence":"D","goals":["gut"],"notes":"Lactase for lactose intolerance is the clearest use."},{"id":"elderberry","name":"Elderberry","kind":"supplement","category":"Immunity","dose":"As labelled","timing":"During colds","evidence":"D","goals":["immunity"],"notes":"May shorten colds slightly. Never eat raw berries."}],"clinical":[{"id":"metformin","name":"Metformin","kind":"clinical","category":"Biguanide","status":"Prescription (US)","uses":"Type 2 diabetes, prediabetes, PCOS","mechanism":"Lowers liver glucose output and improves insulin sensitivity.","evidence_text":"TAME trial is testing it as an ageing drug. May blunt muscle and VO2 max gains from training in healthy people.","risks":"GI upset, B12 deficiency, rare lactic acidosis (mainly kidney disease).","labs":"HbA1c, fasting glucose, B12, kidney function (eGFR)","goals":["metabolic","longevity"]},{"id":"semaglutide","name":"Semaglutide","kind":"clinical","category":"GLP-1 receptor agonist (biologic peptide)","status":"Prescription (US, FDA-approved)","uses":"Type 2 diabetes, obesity, cardiovascular risk reduction","mechanism":"Mimics GLP-1 to slow stomach emptying, cut appetite and improve insulin release.","evidence_text":"SELECT trial: 20% fewer major cardiovascular events. 15% average weight loss in obesity trials.","risks":"Nausea, vomiting, muscle and lean-mass loss, gallbladder disease, pancreatitis; avoid with personal/family history of medullary thyroid cancer.","labs":"HbA1c, lipids, body composition (DEXA), kidney function","goals":["bodycomp","metabolic","heart","longevity"]},{"id":"tirzepatide","name":"Tirzepatide","kind":"clinical","category":"GIP/GLP-1 receptor agonist (biologic peptide)","status":"Prescription (US, FDA-approved)","uses":"Type 2 diabetes, obesity, sleep apnoea","mechanism":"Acts on both GIP and GLP-1 receptors to reduce appetite and improve glucose control.","evidence_text":"SURMOUNT trials: about 20% average weight loss.","risks":"Similar to semaglutide: GI effects, lean-mass loss, gallbladder and pancreatitis risk.","labs":"HbA1c, lipids, body composition","goals":["bodycomp","metabolic","heart"]},{"id":"liraglutide","name":"Liraglutide","kind":"clinical","category":"GLP-1 receptor agonist (biologic peptide)","status":"Prescription (US)","uses":"Type 2 diabetes, obesity","mechanism":"Daily GLP-1 agonist.","evidence_text":"Less weight loss than weekly agents; cardiovascular benefit shown (LEADER).","risks":"GI effects, gallbladder and pancreatitis risk.","labs":"HbA1c, weight","goals":["bodycomp","metabolic"]},{"id":"retatrutide","name":"Retatrutide","kind":"clinical","category":"GIP/GLP-1/glucagon triple agonist","status":"Investigational — not approved","uses":"Obesity (phase 3 trials)","mechanism":"Adds glucagon-receptor activity to raise energy expenditure.","evidence_text":"Phase 2: about 24% weight loss at 48 weeks.","risks":"Long-term safety unknown. Not legally available outside trials.","labs":"Trial-managed","goals":["bodycomp","metabolic"]},{"id":"empagliflozin","name":"Empagliflozin","kind":"clinical","category":"SGLT2 inhibitor","status":"Prescription (US)","uses":"Type 2 diabetes, heart failure, chronic kidney disease","mechanism":"Makes the kidneys excrete glucose.","evidence_text":"Strong heart and kidney protection; extended lifespan in male mice (ITP, canagliflozin).","risks":"Genital infections, dehydration, rare ketoacidosis.","labs":"Kidney function, glucose, ketones if unwell","goals":["metabolic","heart","longevity"]},{"id":"acarbose","name":"Acarbose","kind":"clinical","category":"Alpha-glucosidase inhibitor","status":"Prescription (US)","uses":"Type 2 diabetes","mechanism":"Slows carbohydrate digestion to blunt glucose spikes.","evidence_text":"Extended lifespan in mice (ITP).","risks":"Gas, bloating, diarrhoea.","labs":"Glucose, HbA1c, liver enzymes","goals":["metabolic","longevity"]},{"id":"rapamycin-sirolimus","name":"Rapamycin (sirolimus)","kind":"clinical","category":"mTOR inhibitor","status":"Prescription (US) for transplant; longevity use is off-label","uses":"Organ transplant rejection, some rare diseases","mechanism":"Inhibits mTOR, a central nutrient-sensing growth pathway.","evidence_text":"Most robust lifespan extension in mice. Human longevity trials (e.g. PEARL) are small and early.","risks":"Immune suppression, mouth ulcers, raised lipids and glucose, impaired wound healing.","labs":"Lipids, glucose, blood count, drug levels where applicable","goals":["longevity"]},{"id":"statins-e-g-rosuvastatin","name":"Statins (e.g. rosuvastatin)","kind":"clinical","category":"HMG-CoA reductase inhibitor","status":"Prescription (US)","uses":"High LDL and ApoB, cardiovascular prevention","mechanism":"Blocks cholesterol production in the liver.","evidence_text":"Decades of outcome data for heart attack and stroke prevention.","risks":"Muscle aches, small rise in diabetes risk, rare liver injury.","labs":"Lipid panel, ApoB, liver enzymes, CK if symptoms, HbA1c","goals":["heart","longevity"]},{"id":"ezetimibe","name":"Ezetimibe","kind":"clinical","category":"Cholesterol absorption inhibitor","status":"Prescription (US)","uses":"High LDL","mechanism":"Blocks cholesterol absorption in the gut.","evidence_text":"Adds to statins (IMPROVE-IT).","risks":"Generally well tolerated.","labs":"Lipid panel, ApoB","goals":["heart"]},{"id":"pcsk9-inhibitors-evolocumab-alirocumab","name":"PCSK9 inhibitors (evolocumab, alirocumab)","kind":"clinical","category":"Monoclonal antibody (biologic)","status":"Prescription (US)","uses":"High LDL, cardiovascular disease","mechanism":"Increases LDL receptor recycling in the liver.","evidence_text":"Lowers LDL 50–60%; fewer cardiovascular events.","risks":"Injection-site reactions; cost.","labs":"Lipid panel, ApoB","goals":["heart","longevity"]},{"id":"bempedoic-acid","name":"Bempedoic acid","kind":"clinical","category":"ACL inhibitor","status":"Prescription (US)","uses":"High LDL, statin intolerance","mechanism":"Blocks cholesterol production upstream of statins without muscle effects.","evidence_text":"CLEAR Outcomes: fewer cardiovascular events.","risks":"Raised uric acid, gout, tendon rupture (rare).","labs":"Lipids, uric acid","goals":["heart"]},{"id":"low-dose-aspirin","name":"Low-dose aspirin","kind":"clinical","category":"Antiplatelet","status":"Over the counter; prevention use should be clinician-guided","uses":"Secondary prevention of heart attack and stroke","mechanism":"Irreversibly inhibits platelet COX-1.","evidence_text":"No longer advised for routine primary prevention in older adults (ASPREE).","risks":"Gastrointestinal and brain bleeding.","labs":"Blood count if bleeding","goals":["heart"]},{"id":"telmisartan","name":"Telmisartan","kind":"clinical","category":"Angiotensin receptor blocker","status":"Prescription (US)","uses":"High blood pressure","mechanism":"Blocks angiotensin II; partial PPAR-gamma activity.","evidence_text":"Strong blood pressure outcome data.","risks":"High potassium, dizziness, kidney effects; not in pregnancy.","labs":"Blood pressure, potassium, kidney function","goals":["heart","metabolic"]},{"id":"testosterone-replacement-therapy","name":"Testosterone replacement therapy","kind":"clinical","category":"Androgen (hormone therapy)","status":"Prescription, controlled substance (US Schedule III)","uses":"Diagnosed male hypogonadism","mechanism":"Replaces testosterone when the body makes too little.","evidence_text":"Improves symptoms in confirmed deficiency. TRAVERSE trial: no increase in major cardiovascular events in men with hypogonadism.","risks":"Raised haematocrit, infertility and testicular shrinkage, acne, sleep apnoea, prostate effects. Use without a diagnosis is illegal and unsafe.","labs":"Total and free testosterone, haematocrit, PSA, estradiol, lipids","goals":["hormones"]},{"id":"menopausal-hormone-therapy","name":"Menopausal hormone therapy","kind":"clinical","category":"Estrogen ± progestogen","status":"Prescription (US)","uses":"Menopause symptoms, bone loss prevention","mechanism":"Replaces estrogen (plus progestogen if you have a uterus).","evidence_text":"Best for symptoms when started within 10 years of menopause or before age 60.","risks":"Blood clots and stroke (lower with skin patches), breast cancer risk with combined therapy.","labs":"Mammography, blood pressure, bone density","goals":["hormones","joints"]},{"id":"levothyroxine","name":"Levothyroxine","kind":"clinical","category":"Thyroid hormone","status":"Prescription (US)","uses":"Hypothyroidism","mechanism":"Replaces thyroxine (T4).","evidence_text":"Standard treatment for deficiency only.","risks":"Over-treatment causes arrhythmia and bone loss.","labs":"TSH, free T4","goals":["hormones"]},{"id":"dhea","name":"DHEA","kind":"clinical","category":"Adrenal hormone precursor","status":"Dietary supplement in the US; prescription or banned elsewhere; banned in sport (WADA)","uses":"Adrenal insufficiency (specialist use)","mechanism":"Converted into testosterone and estrogen.","evidence_text":"Benefits in healthy people are inconsistent.","risks":"Acne, hair loss, hormone-sensitive cancer concerns.","labs":"DHEA-S, sex hormones","goals":["hormones"]},{"id":"finasteride","name":"Finasteride","kind":"clinical","category":"5-alpha-reductase inhibitor","status":"Prescription (US)","uses":"Male pattern hair loss, enlarged prostate","mechanism":"Lowers DHT.","evidence_text":"Effective for hair loss.","risks":"Sexual side effects, mood changes; lowers PSA readings.","labs":"PSA (interpret ×2)","goals":["skin"]},{"id":"minoxidil","name":"Minoxidil","kind":"clinical","category":"Vasodilator","status":"OTC topical; oral is prescription","uses":"Hair loss; oral form for blood pressure","mechanism":"Prolongs the hair growth phase.","evidence_text":"Effective for hair loss.","risks":"Scalp irritation; oral form can cause fluid retention and fast heart rate.","labs":"Blood pressure, heart rate (oral)","goals":["skin"]},{"id":"tadalafil","name":"Tadalafil","kind":"clinical","category":"PDE5 inhibitor","status":"Prescription (US)","uses":"Erectile dysfunction, enlarged prostate, pulmonary hypertension","mechanism":"Increases blood flow by boosting cGMP.","evidence_text":"Approved indications only; no proven performance benefit.","risks":"Headache, flushing; dangerous with nitrates.","labs":"Blood pressure","goals":["heart","hormones"]},{"id":"low-dose-naltrexone","name":"Low-dose naltrexone","kind":"clinical","category":"Opioid antagonist (off-label low dose)","status":"Prescription (US), off-label","uses":"Off-label for fibromyalgia, some autoimmune conditions","mechanism":"Brief opioid-receptor blockade with possible anti-inflammatory effects.","evidence_text":"Small trials only.","risks":"Vivid dreams, insomnia; blocks opio const GOALS = Object.fromEntries(CATALOG.goals.map(g => [g.id, g]));
const ALL = [...CATALOG.supplements, ...CATALOG.clinical];
const BYID = Object.fromEntries(ALL.map(c => [c.id, c]));
const EV_TEXT = { A: "Strong evidence", B: "Moderate evidence", C: "Limited or mixed evidence", D: "Weak or mostly preclinical evidence" };
const LAB_MARKERS = ["25(OH) Vitamin D","ApoB","LDL-C","HDL-C","Triglycerides","Lp(a)","HbA1c","Fasting glucose","Fasting insulin","hs-CRP","Ferritin","Vitamin B12","Homocysteine","TSH","Free T4","Total testosterone","Estradiol","Haematocrit","Hemoglobin","ALT","AST","eGFR","Creatinine","Cystatin C","Uric acid","Omega-3 index","Resting heart rate","HRV (rMSSD)","VO2 max","Body fat %","Lean mass","Weight","Blood pressure (systolic)","Grip strength","Biological age (epigenetic)"];

// ---------- storage ----------
const KEY = "biostack.v1";
function load() { try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.stack) return s; } catch {} return null; }
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {} }
const today = () => new Date().toISOString().slice(0, 10);
const daysAgo = n => new Date(Date.now() - n * 864e5).toISOString().slice(0, 10);
function seed() {
  const mk = (id, dose, time) => ({ uid: crypto.randomUUID(), itemId: id, name: BYID[id].name, dose, time, example: true });
  const stack = [mk("creatine-monohydrate", "5 g", "08:00"), mk("vitamin-d3", "2,000 IU", "08:00"), mk("omega-3-epa-dha", "2 g EPA+DHA", "12:30"), mk("magnesium-glycinate", "300 mg", "21:30")];
  const log = [];
  for (let d = 1; d <= 6; d++) stack.forEach((s, i) => { if ((d + i) % 5) log.push({ uid: crypto.randomUUID(), stackUid: s.uid, name: s.name, dose: s.dose, date: daysAgo(d), time: s.time, note: "", example: true }); });
  const labs = [
    { uid: crypto.randomUUID(), marker: "25(OH) Vitamin D", value: 24, unit: "ng/mL", date: daysAgo(150), example: true },
    { uid: crypto.randomUUID(), marker: "25(OH) Vitamin D", value: 38, unit: "ng/mL", date: daysAgo(60), example: true },
    { uid: crypto.randomUUID(), marker: "25(OH) Vitamin D", value: 46, unit: "ng/mL", date: daysAgo(5), example: true },
    { uid: crypto.randomUUID(), marker: "Omega-3 index", value: 4.8, unit: "%", date: daysAgo(150), example: true },
    { uid: crypto.randomUUID(), marker: "Omega-3 index", value: 7.9, unit: "%", date: daysAgo(5), example: true },
  ];
  return { stack, log, labs, effects: [], examples: true };
}
let state = load() || seed();

// ---------- helpers ----------
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 2200); }
const evBadge = c => c.kind === "clinical" ? `<span class="ev ev-Rx" title="Clinical / prescription reference">Rx</span>` : `<span class="ev ev-${c.evidence}" title="${EV_TEXT[c.evidence]}">${c.evidence}</span>`;
const goalChips = ids => ids.map(g => `<a class="chip" href="#library" data-goal="${g}">${esc(GOALS[g].name)}</a>`).join("");
function clearExamples() {
  state.stack = state.stack.filter(x => !x.example); state.log = state.log.filter(x => !x.example);
  state.labs = state.labs.filter(x => !x.example); state.examples = false; save(); render(); toast("Example data removed");
}
const exampleBanner = () => state.examples ? `<div class="notice row" style="align-items:center"><span style="flex:3 1 260px">You're looking at <b>example data</b> so you can see how tracking works. Clear it when you're ready to start your own.</span><button id="clearEx" style="flex:0 0 auto">Clear example data</button></div>` : "";

// ---------- views ----------
const filters = { q: "", kind: "all", goal: null, ev: "all" };

function viewToday() {
  const t = today();
  const taken = new Set(state.log.filter(l => l.date === t).map(l => l.stackUid));
  const sorted = [...state.stack].sort((a, b) => a.time.localeCompare(b.time));
  const last7 = [...Array(7)].map((_, i) => daysAgo(6 - i));
  const rows = sorted.map(s => {
    const dots = last7.map(d => `<span class="${state.log.some(l => l.stackUid === s.uid && l.date === d) ? "on" : ""}" title="${d}"></span>`).join("");
    return `<div class="check"><input type="checkbox" id="tk-${s.uid}" data-take="${s.uid}" ${taken.has(s.uid) ? "checked" : ""} aria-label="Taken: ${esc(s.name)}">
      <label for="tk-${s.uid}" style="color:var(--ink);font-size:.95rem"><b style="font-weight:600">${esc(s.name)}</b><span class="muted" style="font-size:.82rem">${esc(s.dose)} · ${esc(s.time)}</span></label>
      <div class="dots" aria-label="Last 7 days">${dots}</div></div>`;
  }).join("") || `<div class="empty">Your stack is empty. Add items from the <a href="#library">Library</a>.</div>`;
  const doneN = sorted.filter(s => taken.has(s.uid)).length;
  const adherence = state.stack.length ? Math.round(100 * state.log.filter(l => last7.includes(l.date) && state.stack.some(s => s.uid === l.stackUid)).length / (state.stack.length * 7)) : 0;
  return `${exampleBanner()}
  <div><p class="eyebrow">${new Date().toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" })}</p><h1>Today's stack</h1></div>
  <div class="grid2">
    <section class="panel"><div class="row" style="align-items:center"><h2 style="flex:2">Scheduled</h2><span class="muted" style="flex:0 0 auto;font-family:var(--mono)">${doneN}/${sorted.length} taken · 7-day ${adherence}%</span></div>
      <div>${rows}</div>
      <div class="row"><button data-manage>Edit stack</button><a class="btn" href="#library">Add from library</a></div></section>
    <section class="panel"><h2>Log something else</h2>
      <p class="muted" style="font-size:.9rem">Record any item, including prescriptions your clinician manages. Enter the dose you were actually given.</p>
      <form id="quick" class="row" style="display:grid;gap:10px">
        <label>Item<input id="qName" list="allNames" required placeholder="e.g. Electrolytes"></label>
        <div class="row"><label>Dose<input id="qDose" placeholder="e.g. 500 mg sodium"></label><label>Time<input id="qTime" type="time"></label></div>
        <label>Notes or side effects<input id="qNote" placeholder="Optional"></label>
        <button class="primary" type="submit">Add to log</button>
      </form>
      <datalist id="allNames">${ALL.map(c => `<option value="${esc(c.name)}">`).join("")}</datalist>
    </section>
  </div>
  <section class="panel"><h2>Side effects & how you feel</h2>
    <form id="fx" class="row"><label style="flex:3 1 240px">What happened<input id="fxText" required placeholder="e.g. Tingling 20 minutes after beta-alanine"></label>
      <label style="flex:1 1 120px">Severity<select id="fxSev"><option>Mild</option><option>Moderate</option><option>Severe</option></select></label>
      <button type="submit" style="flex:0 0 auto">Record</button></form>
    ${state.effects.length ? `<div class="tablewrap"><table><tr><th>Date</th><th>Note</th><th>Severity</th></tr>${state.effects.slice(-6).reverse().map(e => `<tr><td class="num">${e.date}</td><td>${esc(e.text)}</td><td>${e.sev}</td></tr>`).join("")}</table></div>` : `<p class="muted" style="font-size:.9rem">Nothing recorded. Severe or worrying symptoms: stop and contact a clinician. In the US call 911 for emergencies or Poison Control on 1-800-222-1222.</p>`}
  </section>`;
}

function filtered() {
  const q = filters.q.toLowerCase();
  return ALL.filter(c => (filters.kind === "all" || c.kind === filters.kind)
    && (!filters.goal || c.goals.includes(filters.goal))
    && (filters.ev === "all" || c.evidence === filters.ev)
    && (!q || (c.name + " " + c.category + " " + (c.notes || c.uses || "")).toLowerCase().includes(q)));
}
function viewLibrary() {
  const items = filtered();
  const kindBtn = (k, label) => `<button class="chip" data-kind="${k}" aria-pressed="${filters.kind === k}">${label}</button>`;
  const evBtn = (e, label) => `<button class="chip" data-ev="${e}" aria-pressed="${filters.ev === e}">${label}</button>`;
  return `<div><p class="eyebrow">${CATALOG.supplements.length} supplements · ${CATALOG.clinical.length} clinical references</p><h1>Library</h1></div>
  <section class="panel">
    <label>Search<input id="q" type="search" value="${esc(filters.q)}" placeholder="Name, category or keyword"></label>
    <div class="chips">${kindBtn("all", "Everything")}${kindBtn("supplement", "Supplements")}${kindBtn("clinical", "Prescription & clinical")}</div>
    <div class="chips">${evBtn("all", "Any evidence")}${["A", "B", "C", "D"].map(e => evBtn(e, `Grade ${e}`)).join("")}</div>
    <div class="chips"><span class="eyebrow" style="align-self:center">Goal</span>${CATALOG.goals.map(g => `<button class="chip" data-goalf="${g.id}" aria-pressed="${filters.goal === g.id}">${esc(g.name)}</button>`).join("")}</div>
    <div class="legend"><span><i class="ev ev-A">A</i>Strong</span><span><i class="ev ev-B">B</i>Moderate</span><span><i class="ev ev-C">C</i>Limited</span><span><i class="ev ev-D">D</i>Weak</span><span><i class="ev ev-Rx">Rx</i>Clinician-managed, reference only</span></div>
  </section>
  <section class="panel"><p class="muted" style="font-size:.85rem">${items.length} result${items.length === 1 ? "" : "s"}</p>
    <div class="list">${items.map(c => `<button class="item" data-open="${c.id}">${evBadge(c)}<div><b style="font-weight:600">${esc(c.name)}</b><div class="sub">${esc(c.category)} · ${c.goals.map(g => GOALS[g].name).join(", ")}</div></div><span class="dose">${esc(c.kind === "clinical" ? c.status : c.dose)}</span></button>`).join("") || `<div class="empty">No matches. Try removing a filter.</div>`}</div>
  </section>`;
}

function detail(c) {
  const inStack = state.stack.some(s => s.itemId === c.id);
  const facts = c.kind === "supplement"
    ? [["Typical dose", c.dose], ["Timing", c.timing], ["Evidence", `Grade ${c.evidence}: ${EV_TEXT[c.evidence]}`], ["Notes & cautions", c.notes]]
    : [["Status", c.status], ["Approved uses", c.uses], ["How it works", c.mechanism], ["Evidence", c.evidence_text], ["Key risks", c.risks], ["Labs to monitor", c.labs], ["Dosing", "Set by your prescribing clinician. BioStack doesn't provide doses for prescription or clinical compounds."]];
  return `<div class="row" style="align-items:center">${evBadge(c)}<h2 style="flex:5">${esc(c.name)}</h2><button data-close style="flex:0 0 auto" aria-label="Close">Close</button></div>
    <p class="eyebrow">${esc(c.category)}</p>
    <dl class="facts">${facts.map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join("")}</dl>
    <div><p class="eyebrow" style="margin-bottom:8px">Linked goals</p><div class="chips">${goalChips(c.goals)}</div></div>
    <form id="addStack" class="panel" style="background:var(--bg)">
      <h3>${inStack ? "Add another schedule" : "Add to my stack"}</h3>
      <div class="row"><label>Dose you take<input id="asDose" required placeholder="${c.kind === "supplement" ? "e.g. " + esc(c.dose.split(",")[0]) : "As prescribed"}"></label>
      <label>Time<input id="asTime" type="time" value="08:00" required></label></div>
      <button class="primary" type="submit">Add to stack</button>
    </form>
    <p class="muted" style="font-size:.8rem">General information, not medical advice. Check with a clinician before starting anything, especially if you take medication, are pregnant, or have a health condition. Choose third-party tested products (NSF Certified for Sport, Informed Sport, USP).</p>`;
}

function viewGoals() {
  return `<div><p class="eyebrow">${CATALOG.goals.length} goals</p><h1>Goals</h1><p class="muted">Each compound is linked to the goals it has been studied for. Bars show the evidence mix.</p></div>
  <div class="goals">${CATALOG.goals.map(g => {
    const items = ALL.filter(c => c.goals.includes(g.id));
    const counts = ["A", "B", "C", "D"].map(e => items.filter(c => c.evidence === e).length);
    const rx = items.filter(c => c.kind === "clinical").length;
    const tot = items.length || 1;
    const top = items.filter(c => c.evidence === "A" || c.evidence === "B").slice(0, 4).map(c => c.name).join(", ");
    return `<button class="goal panel" data-goalview="${g.id}"><b>${esc(g.name)}</b><span class="n">${items.length - rx} supplements · ${rx} clinical</span>
      <div class="bars">${counts.map((n, i) => `<span style="width:${100 * n / tot}%;background:var(--ev-${"abcd"[i]})"></span>`).join("")}<span style="width:${100 * rx / tot}%;background:var(--ink)"></span></div>
      <span class="muted" style="font-size:.82rem">${top ? "Best supported: " + esc(top) : "Evidence is limited for this goal."}</span></button>`;
  }).join("")}</div>`;
}

function spark(vals) {
  if (vals.length < 2) return "";
  const min = Math.min(...vals), max = Math.max(...vals), r = max - min || 1;
  const pts = vals.map((v, i) => [4 + i * 112 / (vals.length - 1), 28 - 24 * (v - min) / r]);
  const d = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
  const [lx, ly] = pts[pts.length - 1];
  return `<svg class="spark" viewBox="0 0 120 32" aria-hidden="true"><path d="${d} L${lx} 30 L4 30Z" fill="var(--accent-soft)"/><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="1.6"/><circle cx="${lx}" cy="${ly}" r="2.6" fill="var(--accent)"/></svg>`;
}
function viewLabs() {
  const by = {};
  [...state.labs].sort((a, b) => a.date.localeCompare(b.date)).forEach(l => (by[l.marker] ||= []).push(l));
  const markers = Object.keys(by);
  return `${exampleBanner()}<div><p class="eyebrow">Biomarkers</p><h1>Labs & measurements</h1><p class="muted">Track blood work and body metrics next to what you take, so you can see whether a change is doing anything.</p></div>
  <section class="panel"><h2>Add a result</h2>
    <form id="labForm" class="row"><label style="flex:2 1 200px">Marker<input id="lMarker" list="markers" required placeholder="e.g. ApoB"></label>
    <label>Value<input id="lValue" type="number" step="any" required></label><label>Unit<input id="lUnit" placeholder="mg/dL"></label>
    <label>Date<input id="lDate" type="date" value="${today()}" required></label><button class="primary" type="submit" style="flex:0 0 auto">Add</button></form>
    <datalist id="markers">${LAB_MARKERS.map(m => `<option value="${m}">`).join("")}</datalist>
  </section>
  <section class="panel"><h2>Trends</h2>${markers.length ? `<div class="tablewrap"><table><tr><th>Marker</th><th>Latest</th><th>Change</th><th>Trend</th><th>Results</th></tr>${markers.map(m => {
    const r = by[m], last = r[r.length - 1], first = r[0];
    const ch = r.length > 1 ? (last.value - first.value) : null;
    return `<tr><td><b style="font-weight:600">${esc(m)}</b></td><td class="num">${last.value} ${esc(last.unit)}<br><span class="muted">${last.date}</span></td><td class="num">${ch === null ? "–" : (ch > 0 ? "+" : "") + +ch.toFixed(2)}</td><td>${spark(r.map(x => x.value))}</td><td class="num">${r.length}</td></tr>`;
  }).join("")}</table></div>` : `<div class="empty">No results yet. Add your first above, or import from a lab service in <a href="#apps">Data apps</a>.</div>`}</section>`;
}

function viewLog() {
  const rows = [...state.log].sort((a, b) => (b.date + b.time).localeCompare(a.date + a.time));
  return `${exampleBanner()}<div><p class="eyebrow">${rows.length} entries</p><h1>Dose log</h1></div>
  <section class="panel">${rows.length ? `<div class="tablewrap"><table><tr><th>Date</th><th>Time</th><th>Item</th><th>Dose</th><th>Note</th><th></th></tr>${rows.slice(0, 200).map(l => `<tr><td class="num">${l.date}</td><td class="num">${esc(l.time || "")}</td><td>${esc(l.name)}</td><td>${esc(l.dose)}</td><td>${esc(l.note)}</td><td><button data-dellog="${l.uid}" aria-label="Delete entry">Delete</button></td></tr>`).join("")}</table></div>` : `<div class="empty">Nothing logged yet. Tick items on <a href="#today">Today</a> to log them.</div>`}
  <div class="row"><button id="exportBtn">Copy my data (JSON)</button><button id="wipeBtn">Delete all my data</button></div>
  <textarea id="exportBox" rows="6" hidden readonly></textarea>
  <p class="muted" style="font-size:.82rem">Your data stays in this browser. Nothing is sent anywhere.</p></section>`;
}

function viewApps() {

// ---------- routing & events ----------
const VIEWS = { today: viewToday, library: viewLibrary, goals: viewGoals, labs: viewLabs, log: viewLog, apps: viewApps };
function route() { const h = location.hash.slice(1); return VIEWS[h] ? h : "today"; }
function render() {
  const r = route();
  document.querySelectorAll("nav a").forEach(a => a.getAttribute("href") === "#" + r ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
  $("#view").innerHTML = VIEWS[r]();
  if (r === "library") { const q = $("#q"); q.oninput = () => { filters.q = q.value; const pos = q.selectionStart; render(); const nq = $("#q"); nq.focus(); nq.setSelectionRange(pos, pos); }; }
}
function openItem(id) { $("#dlgBody").innerHTML = detail(BYID[id]); $("#dlg").showModal(); $("#dlgBody").dataset.item = id; }

document.addEventListener("click", e => {
  const t = e.target.closest("button, a, input[type=checkbox]"); if (!t) return;
  if (t.matches("[data-open]")) openItem(t.dataset.open);
  else if (t.matches("[data-close]")) $("#dlg").close();
  else if (t.matches("[data-kind]")) { filters.kind = t.dataset.kind; render(); }
  else if (t.matches("[data-ev]")) { filters.ev = t.dataset.ev; render(); }
  else if (t.matches("[data-goalf]")) { filters.goal = filters.goal === t.dataset.goalf ? null : t.dataset.goalf; render(); }
  else if (t.matches("[data-goalview], [data-goal]")) { e.preventDefault(); filters.goal = t.dataset.goalview || t.dataset.goal; filters.kind = "all"; filters.ev = "all"; filters.q = ""; if ($("#dlg").open) $("#dlg").close(); location.hash === "#library" ? render() : (location.hash = "library"); }
  else if (t.matches("[data-take]")) {
    const s = state.stack.find(x => x.uid === t.dataset.take), d = today();
    if (t.checked) state.log.push({ uid: crypto.randomUUID(), stackUid: s.uid, name: s.name, dose: s.dose, date: d, time: new Date().toTimeString().slice(0, 5), note: "" });
    else state.log = state.log.filter(l => !(l.stackUid === s.uid && l.date === d));
    save(); render();
  }
  else if (t.matches("[data-manage]")) manageStack();
  else if (t.matches("[data-sdel]")) { state.stack = state.stack.filter(s => s.uid !== t.dataset.sdel); save(); manageStack(); render(); }
  else if (t.matches("[data-dellog]")) { state.log = state.log.filter(l => l.uid !== t.dataset.dellog); save(); render(); }
  else if (t.id === "clearEx") clearExamples();
  else if (t.id === "exportBtn") {
    const box = $("#exportBox"), txt = JSON.stringify(state, null, 1); box.value = txt; box.hidden = false;
    navigator.clipboard?.writeText(txt).then(() => toast("Copied to clipboard"), () => { box.select(); toast("Select and copy the text below"); });
  }
  else if (t.id === "wipeBtn") {
    if (t.dataset.armed) { state = { stack: [], log: [], labs: [], effects: [], examples: false }; save(); render(); toast("All data deleted"); }
    else { t.dataset.armed = "1"; t.textContent = "Tap again to delete everything"; t.style.color = "var(--bad)"; }
  }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.matches("[data-sdose]")) { state.stack.find(s => s.uid === t.dataset.sdose).dose = t.value; save(); render(); }
  if (t.matches("[data-stime]")) { state.stack.find(s => s.uid === t.dataset.stime).time = t.value; save(); render(); }
});
document.addEventListener("submit", e => {
  e.preventDefault(); const f = e.target;
  if (f.id === "addStack") {
    const c = BYID[$("#dlgBody").dataset.item];
    state.stack.push({ uid: crypto.randomUUID(), itemId: c.id, name: c.name, dose: $("#asDose").value, time: $("#asTime").value });
    save(); $("#dlg").close(); render(); toast(`${c.name} added to your stack`);
  } else if (f.id === "quick") {
    state.log.push({ uid: crypto.randomUUID(), stackUid: null, name: $("#qName").value, dose: $("#qDose").value, date: today(), time: $("#qTime").value || new Date().toTimeString().slice(0, 5), note: $("#qNote").value });
    save(); render(); toast("Logged");
  } else if (f.id === "fx") {
    state.effects.push({ date: today(), text: $("#fxText").value, sev: $("#fxSev").value }); save(); render(); toast("Recorded");
  } else if (f.id === "labForm") {
    state.labs.push({ uid: crypto.randomUUID(), marker: $("#lMarker").value, value: parseFloat($("#lValue").value), unit: $("#lUnit").value, date: $("#lDate").value });
    save(); render(); toast("Result added");
  }
});
$("#dlg").addEventListener("click", e => { if (e.target.id === "dlg") e.target.close(); });
window.addEventListener("hashchange", render);
render();
</script>
